<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sloj po sloj</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a2f2a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#edf0e2;--paper2:#f7f8f0;--ink:#1d2b3a;--ink2:#4a5868;--mute:#6b7684;--line:#c9cfbd;
 --stamp:#5a3e9b;--orange:#ff6a13;--teal:#00918f;--yellow:#e8b400;--bad:#c0392b;--ok:#2f8a4e;
 --mia:#d14a86;--mar:#1b86a0;--plate:#2a2f2a;
 --acc:var(--orange);--card:var(--paper2);--warn:var(--yellow);
 --fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Atkinson Hyperlegible',system-ui,sans-serif;--ft:'Courier Prime',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:15.5px/1.45 var(--fb);background:var(--paper)}
body{background-image:linear-gradient(#1d2b3a0d 1px,transparent 1px),linear-gradient(90deg,#1d2b3a0d 1px,transparent 1px);background-size:22px 22px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:var(--paper2);color:var(--ink);border-radius:8px;padding:8px 12px;box-shadow:0 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
button.p{background:var(--orange);color:#fff;border-color:var(--ink)}
button.s{padding:4px 9px;font-size:13.5px;box-shadow:0 1.5px 0 var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
input,select,textarea{font:inherit;padding:8px;border:1.5px solid var(--ink2);border-radius:6px;background:#fff;width:100%;color:var(--ink)}
a{color:var(--stamp)}
h2,h3,.big{font-family:var(--fd);letter-spacing:-.01em}
/* top bar = printer display */
#top{position:sticky;top:0;z-index:5;position:sticky;background:var(--plate);color:#f2f2e8;padding:8px 12px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border-bottom:3px solid var(--ink)}
#top .clock{font-family:var(--fd);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--orange)}
#top .date{font-size:13.5px;opacity:.85}
#top .chip{background:#ffffff14;border:1px solid #ffffff22;border-radius:6px;padding:2px 8px;font-size:13px}
#top button{background:#ffffff1a;color:#fff;border:1px solid #ffffff33;box-shadow:none;padding:4px 10px}
.daybar{position:absolute;left:0;right:0;bottom:-3px;height:5px;display:flex;gap:1px;padding:0 1px}
.daybar i{flex:1;background:#ffffff14}
.daybar i.on{background:var(--orange)}
.daybar i.now{background:#ffd2b5;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
#wrap{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;max-width:1180px;margin:0 auto}
@media(min-width:900px){#wrap{grid-template-columns:1.25fr 380px}#phoneDock{position:sticky;top:76px;align-self:start}#phoneBtn{display:none}#closePh{display:none}}
@media(max-width:899px){#phoneDock{display:none}#phoneDock.open{display:block;position:fixed;inset:0;z-index:20;background:#1d2b3acc;padding:14px}#phoneDock.open .phone{margin:0 auto}}
/* form cards */
.card{position:relative;background:var(--paper2);border:1.5px solid var(--ink);border-radius:6px;padding:14px 14px 12px;box-shadow:3px 3px 0 #1d2b3a22}
.card[data-form]::after{content:attr(data-form);position:absolute;top:6px;right:10px;font-family:var(--ft);font-size:11px;color:var(--mute)}
.card>b:first-child,.cardtitle{font-family:var(--fd);font-size:17px}
.tabs{display:flex;gap:10px}
.tab{flex:1;display:block;text-align:left;padding:10px 12px;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper2);box-shadow:3px 3px 0 #1d2b3a22}
.tab.on.mia{box-shadow:4px 4px 0 var(--mia);border-color:var(--mia)}.tab.on.marvin{box-shadow:4px 4px 0 var(--mar);border-color:var(--mar)}
.tab b{font-family:var(--fd);font-size:17px}
.spool{width:40px;height:40px;flex:none}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;font-size:12px;color:var(--ink2);margin-top:8px}
.bar{height:9px;background:#1d2b3a14;border-radius:2px;overflow:hidden;align-self:center}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(0deg,#0000 0 2px,#ffffff40 2px 3px),var(--ok)}
.status{font-size:13px;color:var(--ink2)}
.prog{height:8px;background:#1d2b3a14;border-radius:2px;overflow:hidden;margin-top:5px}
.prog>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--orange) 0 6px,#ff8a45 6px 8px)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.loc h2{margin:0 0 2px;font-size:22px}
.muted{color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.mapbtn{text-align:left;padding:9px 10px;border-radius:6px;box-shadow:0 2px 0 var(--ink);background:#fff}
.mapbtn b{display:block;font-weight:700}
.mapbtn .open{color:var(--ok)}.mapbtn .closed{color:var(--bad)}
/* phone */
.phone{width:100%;max-width:360px;height:660px;max-height:calc(100vh - 100px);background:#22262b;border-radius:36px;padding:11px;display:flex;flex-direction:column;box-shadow:0 18px 40px #1d2b3a55,inset 0 0 0 2px #3a4048}
.screen{flex:1;background:var(--paper2);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;padding:9px 16px 5px;font-size:12px;color:var(--ink2)}
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:14px}
.app{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;background:none;border:0;padding:0;position:relative;box-shadow:none}
.app:active{transform:scale(.95)}
.app .ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:25px;border:1.5px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.badge{position:absolute;top:-5px;right:2px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700;border:1.5px solid var(--paper2)}
.apphead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1.5px solid var(--ink);font-family:var(--fd);font-weight:700;font-size:16px}
.appbody{flex:1;overflow:auto;padding:10px;font-size:14px}
.item{padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;margin-bottom:8px;background:#fff}
.item.unread{border-left:5px solid var(--orange)}
.bub{max-width:85%;padding:7px 11px;border-radius:14px;margin:5px 0;font-size:14px;white-space:pre-wrap;border:1.5px solid var(--line)}
.bub.them{background:#fff;border-bottom-left-radius:4px}
.bub.me{background:#d9f0ee;border-color:#9fd3cf;margin-left:auto;border-bottom-right-radius:4px}
.bub small{display:block;color:var(--mute);font-size:10px}
.home{display:flex;justify-content:center;padding:8px}
.home button{width:110px;height:5px;border-radius:3px;background:#8a9099;border:0;padding:0;box-shadow:none}
/* modal = official form */
#modalBg{position:fixed;inset:0;background:#1d2b3aa6;z-index:40;display:none;align-items:center;justify-content:center;padding:14px}
#modal{position:relative;background:var(--paper2);border:2px solid var(--ink);border-radius:6px;max-width:580px;width:100%;max-height:88vh;overflow:auto;padding:22px 18px 16px;box-shadow:6px 6px 0 #1d2b3a55}
#modal::before{content:'Obrazac SPS-1 · list 1/1';position:absolute;top:6px;right:12px;font-family:var(--ft);font-size:11px;color:var(--mute)}
#modal h3{margin:0 0 10px;font-size:21px;border-bottom:1.5px dashed var(--line);padding-bottom:8px}
/* toasts = paper slips */
#toasts{position:fixed;right:12px;bottom:12px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{background:#fffef6;color:var(--ink);border:1.5px solid var(--ink);border-left:6px solid var(--orange);padding:9px 12px;border-radius:4px;font-size:14px;box-shadow:3px 3px 0 #1d2b3a33;animation:slip .25s ease-out}
@keyframes slip{from{transform:translateX(30px);opacity:0}}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border-bottom:1px dashed var(--line);padding:6px 5px;text-align:left;vertical-align:top}
th{font-family:var(--fd)}
.tag{display:inline-block;font-size:11.5px;border-radius:4px;padding:1px 6px;background:#1d2b3a12;border:1px solid #1d2b3a22}
.tag.ok{background:#dcefe1;color:#1f5e33;border-color:#a9d3b5}.tag.bad{background:#f6dcd9;color:#8a2a22;border-color:#e3aaa3}.tag.warn{background:#f8ecc4;color:#6e5200;border-color:#e3cd84}
/* steps with rubber stamps */
.step{position:relative;display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:12px;flex:none;font-family:var(--fd);font-weight:700;background:#fff}
.step.done b{color:var(--mute)}
.step.done .n{background:var(--stamp);border-color:var(--stamp);color:#fff}
.stampmark{position:absolute;right:6px;top:50%;transform:translateY(-50%) rotate(-9deg);border:2.5px solid var(--stamp);color:var(--stamp);border-radius:6px;padding:0 8px;font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:.06em;opacity:.8;mix-blend-mode:multiply;background:radial-gradient(circle at 30% 40%,#0000 60%,#5a3e9b10)}
.step.fresh .stampmark{animation:thump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{from{transform:translateY(-50%) rotate(-25deg) scale(2.2);opacity:0}}
#phoneBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:15;background:var(--orange);color:#fff;border:2px solid var(--ink);border-radius:26px;padding:12px 22px;font-weight:700;box-shadow:0 4px 0 var(--ink)}
.zvone{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 12px;margin-top:14px;box-shadow:3px 3px 0 #2f8a4e55}
.zvone .p{font-size:30px;line-height:1}
.intro{max-width:620px;margin:40px auto;padding:20px}
.big{font-size:28px;margin:0 0 6px}
.cloud{font-size:12.5px}
/* intro scene */
.scene{min-height:100vh;background:radial-gradient(circle at 70% 15%,#24405c,#101a26 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 16px 28px;position:relative;overflow:hidden}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:60px 60px;opacity:.25}
.stage{position:absolute;top:9%;left:0;right:0;display:flex;justify-content:center;gap:28px;align-items:flex-end;font-size:64px}
.actor{transition:transform .3s,opacity .3s;opacity:.45;position:relative}
.actor.on{opacity:1;transform:scale(1.18) translateY(-6px)}
.actor .lbl{display:block;font-size:12px;text-align:center;opacity:.8;font-family:var(--fb)}
.pr3{width:120px;height:110px;border:4px solid #8f98a8;border-radius:12px;position:relative;background:#1a1f27;box-shadow:0 0 34px #ff6a1355}
.pr3 .layer{position:absolute;bottom:8px;left:35px;width:50px;background:repeating-linear-gradient(0deg,#ff6a13 0 3px,#ff8f50 3px 4px);height:0;animation:grow 7s linear infinite;border-radius:2px}
@keyframes grow{to{height:72px}}
.pr3 .noz{position:absolute;top:10px;left:50px;width:20px;height:14px;background:#cfd6e0;border-radius:3px;animation:slide .9s ease-in-out infinite alternate}
@keyframes slide{from{left:30px}to{left:70px}}
.zv{position:absolute;top:-56px;right:-34px;font-size:44px}
.dlg{width:100%;max-width:640px;background:#ffffff12;backdrop-filter:blur(6px);border:1.5px solid #ffffff40;border-radius:14px;padding:16px 18px;min-height:160px;z-index:2;cursor:pointer}
.dlg .who{font-family:var(--fd);font-weight:800;margin-bottom:6px;font-size:17px}
.who.mia{color:#ff8fc0}.who.marvin{color:#7fd6e6}.who.zvone{color:#9be37a}.who.nar{color:#c9d6ff}
.dlg .x{font-size:19px;min-height:56px}
.dlg .hint{font-size:12px;opacity:.6;text-align:right}
.choice{display:block;width:100%;text-align:left;margin-top:8px;background:#ffffff1a;color:#fff;border:1.5px solid #ffffff55;padding:10px 12px;box-shadow:none}
.choice:hover{background:#ffffff30}
.shake{animation:sh .35s 3}@keyframes sh{25%{transform:translateX(-6px) rotate(-10deg)}75%{transform:translateX(6px) rotate(10deg)}}
.skipb{position:absolute;top:14px;right:14px;background:#ffffff22;color:#fff;border:1px solid #ffffff44;z-index:3;box-shadow:none}
.title{font-family:var(--fd);font-size:60px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1;background:repeating-linear-gradient(0deg,#ff6a13 0 4px,#ff9a5c 4px 6px);-webkit-background-clip:text;background-clip:text;color:transparent}
.title span{display:inline-block;animation:drop .5s backwards}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.scene .card{background:#ffffff12;border-color:#ffffff40;color:#fff;box-shadow:none}
.scene .card::after{color:#ffffff88}
.scene select,.scene input{background:#fff;color:#222}
.paper{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.paper button{flex:none}
.paper.done .t{text-decoration:line-through;color:var(--mute)}
@media(max-width:560px){.stage{font-size:46px;gap:16px;top:13%}.pr3{width:92px;height:86px}.pr3 .layer{left:26px;width:40px}.zv{font-size:34px;top:-44px;right:-20px}#toasts{top:auto;bottom:74px;left:10px;right:10px;max-width:none}.toast{font-size:13px;padding:6px 10px}.title{font-size:44px}#top .clock{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.vc{background:#141b24;color:#fff;border-radius:10px;margin:-6px -4px 0;padding:10px}
.vchead{display:flex;justify-content:space-between;font-size:13px;opacity:.85;margin-bottom:8px}
.vcgrid{position:relative;height:190px;background:radial-gradient(circle at 50% 40%,#2c3e55,#141b24);border-radius:8px;display:grid;place-items:center}
.vctile{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:64px}
.vctile span{font-size:13px;font-family:var(--fb)}
.vctile.me{position:absolute;right:8px;bottom:8px;width:84px;height:64px;background:#1d2b3a;border:1.5px solid #ffffff55;border-radius:6px;font-size:26px;justify-content:center}
.vctile.me span{font-size:10px}
.vcbody{background:var(--paper2);color:var(--ink);border-radius:8px;padding:10px 12px;margin-top:10px}
.vcbar{display:flex;justify-content:center;gap:10px;margin-top:10px}
.vcbar button{background:#2a3644;color:#fff;border-color:#ffffff55;box-shadow:none;border-radius:20px}
.vcbar .end{background:var(--bad)}
.speaking{animation:talk 1.2s ease-in-out infinite}@keyframes talk{50%{transform:scale(1.04)}}
.egov{border-left:5px solid #1b5fa8}

.sweep{animation:sweep .5s ease-in-out infinite alternate}@keyframes sweep{0%{transform:translateX(-20px)}100%{transform:translateX(20px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hot{animation:glow .5s ease-in-out infinite}@keyframes glow{50%{opacity:.5}}
.tl-obj{animation:build 4s steps(12,end) infinite}@keyframes build{0%{clip-path:inset(100% 0 0 0)}86%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
.tl-head{animation:lift 4s steps(12,end) infinite}@keyframes lift{0%{transform:translateY(0)}86%{transform:translateY(-48px)}100%{transform:translateY(-48px)}}
.rain line{animation:fall .7s linear infinite}@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(40px)}}
.snow circle{animation:fallS 3s linear infinite}@keyframes fallS{from{transform:translateY(-20px)}to{transform:translateY(60px)}}
.bld{cursor:pointer}.bld:hover rect.b{filter:brightness(1.08)}
.scene2{display:block;width:100%;height:auto;border:1.5px solid var(--ink);border-radius:6px;margin:8px 0 4px;background:#dfe6d0}
.mapsvg{display:block;width:100%;height:auto;border:1.5px solid var(--ink);border-radius:6px;background:#e3ead4}
.cam{display:block;width:100%;max-width:300px;height:auto;border-radius:6px;border:1.5px solid var(--ink);margin:6px 0}
@media(prefers-reduced-motion:reduce){.sweep,.spin,.hot,.tl-obj,.tl-head,.rain line,.snow circle{animation:none}}

#nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--paper2);border:1.5px solid var(--ink);border-radius:8px;margin:0 0 12px;box-shadow:3px 3px 0 #1d2b3a22}
#nav button{border:0;box-shadow:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink2);min-height:48px;justify-content:center;border-radius:0;position:relative}
#nav button.on{color:var(--orange);font-weight:700}
#nav .nb{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
@media(max-width:899px){#nav{position:fixed;left:0;right:0;bottom:0;z-index:16;margin:0;border-radius:0;border-width:1.5px 0 0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -3px 10px #1d2b3a22}#phoneBtn{display:none}#wrap{padding-bottom:80px}#toasts{bottom:84px}}
.face{width:46px;height:46px;flex:none}
.fcard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){.face{width:38px;height:38px}.fcard{gap:6px}}
.fbig{font-family:var(--fd);font-weight:800;font-size:24px}
canvas{width:100%;height:180px;background:#fff;border:1.5px solid var(--line);border-radius:6px}

/* v10: kompaktni vrh, balončić, likovi na karti, tamni način, intro printer */
#top .ds,#top .tmore{display:none}
@media(max-width:560px){#top{padding:6px 10px 10px;gap:5px 8px}#top .dl{display:none}#top .ds{display:inline;font-size:13px;opacity:.85}#top .tx{display:none}#top.open .tx{display:inline-block}#top .tmore{display:inline-block}#top .chip{font-size:12.5px;padding:2px 6px}#top button{padding:3px 8px;font-size:13px}
 #toasts{left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);align-items:center}.toast{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 24px);border-radius:20px;border-left-width:1.5px;font-size:12.5px;padding:6px 14px;box-shadow:0 3px 10px #1d2b3a33;cursor:pointer}}
.walk{animation:bob .45s steps(2) infinite}@keyframes bob{50%{transform:translateY(-1.6px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
.rep{font-family:var(--ft);background:#fffdf6;border:1.5px dashed #1d2b3a55;padding:12px 14px;position:relative;overflow:hidden;animation:printout 1.2s steps(10) both}
@keyframes printout{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.rep .row{display:flex;justify-content:space-between;border-bottom:1px dotted #1d2b3a44;padding:3px 0}
.rep .stampd{position:absolute;right:10px;bottom:14px;transform:rotate(-12deg);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--fd);font-weight:800;padding:2px 8px;border-radius:6px;opacity:.85;animation:thump .4s 1.3s backwards}
.isvg{width:100%;max-width:420px;display:block;margin:0 auto}
.ittl{animation:ibuild 3.2s steps(11,end) .3s both}@keyframes ibuild{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.ihead{animation:ilift 3.2s steps(11,end) .3s both}@keyframes ilift{from{transform:translateY(0)}to{transform:translateY(-62px)}}
.isweep{animation:isw .58s linear 6 both}@keyframes isw{0%,100%{transform:translateX(0)}25%{transform:translateX(-120px)}75%{transform:translateX(120px)}}
.izv{animation:izv .6s 3.6s cubic-bezier(.3,1.6,.6,1) both}@keyframes izv{from{transform:translateY(-60px);opacity:0}}
.ibub{animation:fadein .4s 4.2s both}@keyframes fadein{from{opacity:0}}
body.dark{--paper:#131920;--paper2:#1c242e;--ink:#e6eaee;--ink2:#b5bfca;--mute:#8d99a6;--line:#344251;--card:#1c242e;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px)}
body.dark button{box-shadow:0 2px 0 #000a}body.dark button.p{color:#fff;border-color:#000}

<script>
'use strict';
/* ===================== Sloj po sloj — prva igriva verzija =====================
   1 sat u igri = 1 minuta u stvarnosti (1 sekunda = 1 minuta igre).
   Svi iznosi, paketi i cijene su izmišljeni za igru. */

const SAVE_KEY='slojposloj_save_v1';
const START=new Date(2031,2,3,7,0,0); // ponedjeljak 3. 3. 2031.
const DAYS=['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'];
const MONTHS=['siječnja','veljače','ožujka','travnja','svibnja','lipnja','srpnja','kolovoza','rujna','listopada','studenoga','prosinca'];
let S=null; // stanje igre
let phoneApp={mia:null,marvin:null}; let phoneArg={mia:null,marvin:null};
let dirty=true, audioCtx=null, musicTimer=null, timerId=null;

/* ---------- pomoćne ---------- */
let _ri=null;
const $=s=>{if(_ri&&s[0]==='#'&&_ri[s.slice(1)])return _ri[s.slice(1)];return document.querySelector(s)};
function radioVal(name){if(_ri&&_ri['radio:'+name])return _ri['radio:'+name].value;const el=document.querySelector('input[name='+name+']:checked');return el?el.value:null}
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eur=v=>(Math.round(v*100)/100).toLocaleString('hr-HR',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function D(t){return new Date(START.getTime()+(t??S.t)*60000)}
function hh(t){const d=D(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dateStr(t){const d=D(t);return DAYS[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]+' '+d.getFullYear()+'.'}
function shortDate(t){const d=D(t);return d.getDate()+'.'+(d.getMonth()+1)+'. '+hh(t)}
function hour(){return D().getHours()}
function dow(){return D().getDay()}
function dayNo(){return Math.floor(S.t/1440)}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function isHoliday(d){const key=d.getDate()+'-'+(d.getMonth()+1);if(['1-1','6-1','1-5','30-5','22-6','5-8','15-8','1-11','18-11','25-12','26-12'].includes(key))return true;const e=easter(d.getFullYear());for(const off of [0,1,60]){const x=new Date(e);x.setDate(x.getDate()+off);if(x.getDate()===d.getDate()&&x.getMonth()===d.getMonth())return true}return false}
function isWorkDay(t){const d=D(t);const w=d.getDay();return w>=1&&w<=5&&!isHoliday(d)}

const cloud={status:'local',db:null,ref:null,name:'',busy:false,pending:false,last:0};
function cloudLabel(){return cloud.status==='cloud'?'☁️ '+(cloud.name?esc(cloud.name)+' · ':'')+'spremljeno u oblak':cloud.status==='loading'?'☁️ spajam…':'💾 samo ovaj uređaj'}
function withTimeout(pr,ms){return Promise.race([pr,new Promise(r=>setTimeout(()=>r(null),ms))])}
async function initCloud(){try{if(!window.claude||!window.claude.use)return;cloud.status='loading';const db=await withTimeout(window.claude.use('db'),8000);const user=await withTimeout(window.claude.use('user'),8000);if(!db||!user){cloud.status='local';return}const me=await user.me();if(!me||!me.id){cloud.status='local';return}cloud.db=db;cloud.name=me.name||'';cloud.ref=db.doc('data/users/'+me.id+'/save');cloud.status='cloud'}catch(e){cloud.status='local'}}
async function cloudLoad(){if(cloud.status!=='cloud')return null;try{const snap=await withTimeout(cloud.ref.get(),8000);if(snap&&snap.exists){const d=snap.data();return d&&d.json?JSON.parse(d.json):null}}catch(e){}return null}
function trimState(){if(!S)return;S.log=S.log.slice(0,150);for(const c of ['mia','marvin']){S.ph[c].mail=S.ph[c].mail.slice(0,60);for(const k in S.ph[c].th){const th=S.ph[c].th[k];if(th.msgs.length>40)th.msgs=th.msgs.slice(-40)}}S.days=S.days.slice(-400);S.album=S.album.slice(-120);S.cal=S.cal.filter(o=>!o.paid||S.t-o.t<60*1440);const fin=S.orders.filter(o=>['delivered','lost'].includes(o.state)&&(o.paid||o.state==='lost'));if(fin.length>150){const drop=new Set(fin.slice(0,fin.length-150).map(o=>o.id));S.orders=S.orders.filter(o=>!drop.has(o.id))}for(const k in S.kpr){if(S.kpr[k].done&&dayNo()-k>60)delete S.kpr[k]}S.vrticTasks=S.vrticTasks.slice(-30)}
async function cloudSave(force){if(cloud.status!=='cloud'||!S)return;if(!force&&Date.now()-cloud.last<30000)return;if(cloud.busy){cloud.pending=true;return}cloud.busy=true;cloud.last=Date.now();try{trimState();await cloud.ref.set({json:JSON.stringify(S),savedAt:Date.now(),day:dateStr()})}catch(e){if(e&&e.code==='invalid_argument'||e&&e.code==='revoked'||e&&e.code==='not_granted'){cloud.status='local'}}cloud.busy=false;if(cloud.pending){cloud.pending=false;cloudSave(true)}}

/* ---------- zvuk ---------- */
function ac(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}return audioCtx}
function beep(f=880,d=0.12,type='sine',g=0.05,delay=0){const a=ac();if(!a||S&&S.mute)return;const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(a.destination);const t=a.currentTime+delay;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.02)}
function sndMsg(){beep(988,.09);beep(1319,.12,'sine',.05,.1);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function sndMail(){beep(660,.15,'triangle',.05)}
function sndPrint(){const a=ac();if(!a||S.mute)return;for(let i=0;i<6;i++)beep(140+i*30,.12,'sawtooth',.02,i*.15)}
function toggleMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;return}const ch=[[220,277,330],[196,247,294],[175,220,262],[196,247,330]];let i=0;const play=()=>{const c=ch[i++%ch.length];c.forEach((f,k)=>beep(f,2.6,'triangle',.012,k*.05))};play();musicTimer=setInterval(play,2800)}

function toast(t){if(previewing)return;if(NET&&NET.mode==='duo'&&NET.isHost)feed(t);if(applying)return;toastLocal(t)}
function toastLocal(t){const box=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';el.innerHTML=t;box.appendChild(el);const sm=innerWidth<560;if(sm){el.onclick=()=>el.remove()}const mx=sm?1:4;while(box.children.length>mx)box.firstChild.remove();setTimeout(()=>el.remove(),sm?2800:5000)}
function log(t){S.log.unshift({t:S.t,x:t});if(S.log.length>300)S.log.pop()}
function thread(c,id,name){const th=S.ph[c].th;if(!th[id])th[id]={name,msgs:[],unread:0,t:S.t};return th[id]}
function msg(c,id,name,text,opts,meta){const th=thread(c,id,name);th.msgs.push({from:'them',x:text,t:S.t,opts:opts||null,meta:meta||null});th.unread++;th.t=S.t;sndMsg();toast('💬 <b>'+esc(name)+'</b> → '+esc(nm(c))+': '+esc(text.slice(0,70)));dirty=true}
function myMsg(c,id,text){const th=S.ph[c].th[id];if(th){th.msgs.push({from:'me',x:text,t:S.t});th.t=S.t}}
function mail(c,from,subj,body,actions){S.ph[c].mail.unshift({id:'m'+S.t+'_'+Math.floor(Math.random()*1e6),from,subj,body,t:S.t,read:false,actions:actions||[]});sndMail();toast('✉️ '+esc(nm(c))+': <b>'+esc(subj)+'</b>');dirty=true}
function unread(c){let n=0;for(const k in S.ph[c].th)n+=S.ph[c].th[k].unread;return n+S.ph[c].mail.filter(m=>!m.read).length}

const FCOL={crna:['#222','Crna'],bijela:['#f4f4f0','Bijela'],crvena:['#d62f2f','Crvena'],plava:['#2f6fd6','Plava'],zelena:['#2fa35a','Zelena'],narancasta:['#ff6a13','Narančasta']};
function filInit(){if(!S.filCol){const base={crna:.25,bijela:.25,crvena:.125,plava:.125,zelena:.125,narancasta:.125};S.filCol={};let tot=0;Object.keys(base).forEach(k=>{S.filCol[k]=Math.floor(S.filament*base[k]/10)*10;tot+=S.filCol[k]});S.filCol.crna+=S.filament-tot}return S.filCol}
function filSync(){const F=filInit();const sum=Object.values(F).reduce((a,b)=>a+b,0);if(sum===S.filament)return;if(sum<S.filament){F.crna+=S.filament-sum;return}const k=S.filament/Math.max(1,sum);let tot=0;Object.keys(F).forEach(c=>{F[c]=Math.floor(F[c]*k);tot+=F[c]});F.crna+=S.filament-tot}
function filUse(col,g){const F=filInit();let left=g;const take=c=>{const t=Math.min(F[c],left);F[c]-=t;left-=t};if(col&&F[col]!=null)take(col);Object.keys(F).forEach(c=>{if(left>0)take(c)})}
function colName(c){return FCOL[c]?'<span class="fdot" style="background:'+FCOL[c][0]+'"></span>'+FCOL[c][1]:''}
function pickCol(k){return pick(k==='tech'?['crna','crna','bijela','plava']:k==='proto'?['crna','bijela','bijela']:k==='toy'?['crvena','plava','zelena','narancasta']:['bijela','crvena','narancasta','plava','zelena','crna'])}
function colorFix(c,oid){const o=S.orders.find(x=>x.id===oid);const F=filInit();const alt=Object.keys(F).filter(k=>k!==o.col&&F[k]>=o.g);
 const m='<h3>🧵 Nema dovoljno boje: '+colName(o.col)+'</h3><p>Za #'+o.id+' '+esc(o.prod)+' treba <b>'+o.g+' g</b>, a na zalihi je samo <b>'+(F[o.col]||0)+' g</b>.</p><div class="item"><b>1. Naruči novu rolu</b><p class="muted" style="margin:4px 0">PLA 1 kg, dostava 3–5 radnih dana. Rok narudžbe: '+shortDate(o.due)+'.</p><button class="p s" onclick="closeModal();A(\'buy\',\'pla\',\''+o.col+'\',false)">🛒 Naruči '+FCOL[o.col][1].toLowerCase()+' PLA</button> <button class="s" onclick="closeModal();A(\'buy\',\'pla\',\''+o.col+'\',true)">🚀 Ekspres (+8 €, sutra)</button></div><div class="item"><b>2. Pitaj kupca za drugu boju</b><p class="muted" style="margin:4px 0">Mia piše kupcu. Većina pristane, ali ne svi.</p>'+(alt.length?alt.map(k=>'<button class="s" style="margin:2px" onclick="closeModal();A(\'askColor\','+o.id+',\''+k+'\')">'+colName(k)+' ('+F[k]+' g)</button>').join(''):'<p class="muted">Nijedne druge boje nema dovoljno.</p>')+'</div>';
